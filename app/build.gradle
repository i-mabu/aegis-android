plugins {
    id 'com.android.application'
}

android {
    namespace 'jp.aegis.client'
    compileSdk 34

    defaultConfig {
        applicationId 'jp.aegis.client'
        minSdk 26
        targetSdk 34
        versionCode 5
        versionName '1.3'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// 外部依存なし: Android標準API (org.json / HttpURLConnection) のみで実装
dependencies {
}
