plugins {
    id 'com.android.application'
}

android {
    namespace 'jp.aegis.client'
    compileSdk 34

    defaultConfig {
        applicationId 'jp.aegis.client'
        minSdk 26
        targetSdk 34
        versionCode 13
        versionName '1.8.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// データ取得層は Android標準API (org.json / HttpURLConnection) のみで実装。
// UI は Jetpack Compose を使用する (方法Aの手動ビルドでは libs/ へ解決して同梱する)
dependencies {
}
