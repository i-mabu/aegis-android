name: CI

# 軽量CI: 単一ジョブでオフライン手動ビルド (build-apk.sh) を実行し、APKを検証する。
# main への push / PR で実行し、ドキュメントだけの変更では実行しない。
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"
      - name: Build APK (offline manual pipeline)
        run: |
          chmod +x build-apk.sh
          ANDROID_SDK_ROOT="$ANDROID_HOME" ./build-apk.sh
      - name: Run unit tests (pure functions, no network)
        run: |
          mkdir -p /tmp/aegis-test
          javac -cp build/manual/classes:"$ANDROID_HOME/platforms/android-34/android.jar" -d /tmp/aegis-test tests/TestMain.java
          java -cp /tmp/aegis-test:build/manual/classes:"$ANDROID_HOME/platforms/android-34/android.jar" TestMain
      - name: Verify APK
        run: |
          "$ANDROID_HOME/build-tools/34.0.0/aapt2" dump badging dist/aegis-client.apk | head -5
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify dist/aegis-client.apk
