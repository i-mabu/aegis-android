name: CI

# 軽量CI: 単一ジョブでオフライン手動ビルド (build-apk.sh, Kotlin) を実行し、APKを検証する。
# main への push / PR で実行し、ドキュメントだけの変更では実行しない。
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"
      - name: Install Kotlin compiler
        run: |
          curl -sL -o /tmp/kotlin-compiler.zip https://github.com/JetBrains/kotlin/releases/download/v2.0.21/kotlin-compiler-2.0.21.zip
          unzip -q /tmp/kotlin-compiler.zip -d /tmp/kotlin-compiler
          echo "KOTLINC=/tmp/kotlin-compiler/kotlinc/bin/kotlinc" >> "$GITHUB_ENV"
          echo "KOTLIN_STDLIB=/tmp/kotlin-compiler/kotlinc/lib/kotlin-stdlib.jar" >> "$GITHUB_ENV"
      - name: Build APK (offline manual pipeline)
        run: |
          chmod +x build-apk.sh
          ANDROID_SDK_ROOT="$ANDROID_HOME" ./build-apk.sh
      - name: Run unit tests (pure functions, no network)
        run: |
          mkdir -p /tmp/aegis-test
          "$KOTLINC" -cp build/manual/classes:"$ANDROID_HOME/platforms/android-34/android.jar":"$KOTLIN_STDLIB" -d /tmp/aegis-test tests/TestMain.kt
          java -cp /tmp/aegis-test:build/manual/classes:"$ANDROID_HOME/platforms/android-34/android.jar":"$KOTLIN_STDLIB" TestMain
      - name: Verify APK
        run: |
          "$ANDROID_HOME/build-tools/34.0.0/aapt2" dump badging dist/aegis-client.apk | head -5
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify dist/aegis-client.apk
